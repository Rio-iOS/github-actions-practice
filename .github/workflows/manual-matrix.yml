name: Manual matrix
on: push
jobs:
  print:
    strategy:
      matrix: # 多次元マトリックスの定義
        include: # 組み合わせ条件を手動で列挙
          - os: macos-latest # パターン1
            version: "6.2"
          - os: ubuntu-latest # パターン2
            version: "6.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.version }} # versionプロパティの参照
      - run: echo "${RUNNER_OS}" && swift --version