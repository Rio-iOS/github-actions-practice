name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # v1.2.3のようなGitタグがプッシュされると起動
  workflow_dispatch:
jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }} # v1.2.3のような値をGitタグから取得
    permissions:
      contents: write # リリースノートの作成に必要なパーミッション
    steps:
      - uses: actions/checkout@v6

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"

      - name: Build
        run: |
          xcodebuild \
          -project iOS/HelloWorld/HelloWorld.xcodeproj \
          -scheme HelloWorld \
          -destination "platform=iOS Simulator" \
          build
    
      - name: UnitTest
        run: |
          xcodebuild \
          -project iOS/HelloWorld/HelloWorld.xcodeproj \
          -scheme HelloWorld \
          -destination "platform=iOS Simulator" \
          -only-testing:HelloWorldTests \
          test