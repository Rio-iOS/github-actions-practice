name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # v1.2.3のようなGitタグがプッシュされると起動
  workflow_dispatch:
jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ github.ref_name }} # v1.2.3のような値をGitタグから取得
    permissions:
      contents: write # リリースノートの作成に必要なパーミッション
    steps:
      - uses: actions/checkout@v6

      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.2.4"

    # Buildは、Archiveで上書きされるためコメントアウト（学習目的として残す）
    #   - name: Build
    #     run: |
    #       xcodebuild \
    #       -project iOS/HelloWorld/HelloWorld.xcodeproj \
    #       -scheme HelloWorld \
    #       -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
    #       build
    
      - name: UnitTest
        run: |
          xcodebuild \
          -project iOS/HelloWorld/HelloWorld.xcodeproj \
          -scheme HelloWorld \
          -destination "platform=iOS Simulator,name=iPhone 17 Pro" \
          -only-testing:HelloWorldTests \
          test

      - name: Generate Keychain Password
        run: |
          # CI上のみで使用する Keychain 用パスワードをランダム生成する
          # 固定値を使うとセキュリティ的に脆弱であるため、毎回生成する
          echo "KEYCHAIN_PASSWORD=$(openssl rand -base64 32)" >> ${GITHUB_ENV}

      - name: Install Certificate
        env:
            IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
            IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # GitHub Actions 用の Secrets に登録した
          # Base64 文字列をデコードして .p12ファイルを復元する
          echo "${IOS_CERTIFICATE_BASE64}" | base64 --decode > certification.p12

          # CI 用の一時的な Keychain を作成する（デフォルト Keychain を汚さないため）
          # -p: Keychainのパスワードを指定（CI内でのみ使用する一時パスワード）
          security create-keychain \
          -p "${KEYCHAIN_PASSWORD}" \
          build.keychain

          # 証明書（.p12）を Keychain にインポートする
          # -k: インポート先の Keychain を指定
          # -P: .p12 のパスワード
          # -T: 特定のアプリから秘密鍵へのアクセスを許可
          security import certification.p12 \
          -k build.keychain \
          -P "${IOS_CERTIFICATE_PASSWORD}" \
          -T /usr/bin/codesign

          # 作成した Keychain を検索対象に追加する
          # -s: 使用する Keychain のリスト指定
          security list-keychains \
          -s build.keychain
          
          # 作成した Keychain をデフォルト Keychain に設定
          # CI環境では複数の Keychain が存在するため、どれが参照されるのか不定になる
          # build.keychain を優先的に参照させることで、インポートした証明書を確実に利用できるようにする
          security default-keychain -s build.keychain

          # Keychainをアンロックし、codesign が利用できる状態にする
          # -p: Keychain のパスワード
          security unlock-keychain \
          -p "${KEYCHAIN_PASSWORD}" \
          build.keychain

          # CI 中にロックされないように、Keychain のロック防止
          # -l: スリープ時にロック
          # -u: 一定時間ロック
          # -t: 時間（秒）
          security set-keychain-settings -lut 3600 build.keychain

          # Keychain 内の秘密鍵に対して codesignからのアクセスを許可する
          # これがないと「User interaction is not allowed」エラーになる
          # -S: アクセスを許可するアプリのグループ（apple-tool, apple は codesign 等を含む）
          # -s: 設定を保存（変更を確定）
          # -k: Keychain のパスワード
          security set-key-partition-list \
          -S apple-tool:,apple: \
          -s \
          -k "${KEYCHAIN_PASSWORD}" \
          build.keychain

      - name: Install Provisioning Profile
        env:
            HELLO_WORLD_PROFILE_BASE64: ${{ secrets.HELLO_WORLD_PROFILE_BASE64}}
        run: |
          # Base64 文字列をデコードして、Provisioning Profile(.mobileprovision) を復元
          echo "${HELLO_WORLD_PROFILE_BASE64}" | base64 --decode > profile.mobileprovision

          # Xcode / xcodebuild が参照する Provisioning Profile の配置先ディレクトリを作成
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          # Provisioning Profile から UUID を取得
          # security cms で CMS 形式をデコードし、PlistBuddy で UUID を抽出する
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< "$(security cms -D -i profile.mobileprovision)")
          echo "Provisioning UUID: ${UUID}"

          # UUID 名で Provisioning Profile を配置
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

          # 復元した Provisioning Profile は不要なので削除
          rm profile.mobileprovision

      - name: Bump Build Number（timestamp）
        run: |
          BUILD_NUMBER=$(TZ=Asia/Tokyo date +%Y%m%d%H%M%S)
          echo "BUILD_NUMBER: $BUILD_NUMBER"
          agvtool new-version -all $BUILD_NUMBER

      - name: Archive
        run: |
          mkdir -p build

          xcodebuild \
          -project iOS/HelloWorld/HelloWorld.xcodeproj \
          -scheme HelloWorld \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath $PWD/build/HelloWorld.xcarchive \
          CODE_SIGN_STYLE=Manual \
          archive

      - name: Export IPA
        run: |
          mkdir -p build

          xcodebuild \
          -exportArchive \
          -archivePath $PWD/build/HelloWorld.xcarchive \
          -exportOptionsPlist $PWD/ExportOptions.plist \
          -exportPath $PWD/build 

      - name: Upload IPA to App Store Connect
        env:
            APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
            APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
            APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          # APIキーをCI内で利用する.p8ファイルとして復元
          mkdir -p private_keys
          printf "%s" "${APPSTORE_PRIVATE_KEY}" > private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          # IPAファイルをApp Store Connectへアップロード
          xcrun altool --upload-app \
          --type ios \
          --file $PWD/build/HelloWorld.ipa \
          --apiKey ${APPSTORE_KEY_ID} \
          --apiIssuer ${APPSTORE_ISSUER_ID}