name: Lint
on:
    pull_request:
        paths:
          - "**/*.swift"
          - "*.swift"

defaults: # デフォルトシェル
  run:
    shell: bash

concurrency: # 自動キャンセル
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 5 # タイムアウト時間を5分に設定
    steps:
      - uses: actions/checkout@v6 # ステップ1: チェックアウト

      - uses: swift-actions/setup-swift@v3 # ステップ2: 言語セットアップ
        with:
          swift-version: "6.2.4"

      - name: Install SwiftLint # SwiftLintのインストール
        run: brew install swiftlint

      - name: Run SwiftLint # SwiftLintの実行
        run: swiftlint --reporter github-actions-logging