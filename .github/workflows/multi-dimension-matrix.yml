name: Multi-dimension matrix
on: push
jobs:
  print:
    strategy:
      matrix: # 多次元マトリックスの定義
        os: [macos-latest] # osプロパティの定義
        version: ["6.1", "6.2"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: ${{ matrix.version }} # versionプロパティの参照
      - run: echo "${RUNNER_OS}" && swift --version